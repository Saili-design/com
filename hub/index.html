<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e1016; --panel:#161922; --panel2:#1d212c; --line:#262b38;
  --tx:#ffffff; --mu:#a3abc4; --ac:#4657f1; --ac2:#8591ff; --gold:#f5b83d;
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  min-height:100dvh; display:flex; justify-content:center;
  padding:30px 18px calc(32px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:24px}

/* entree : backwards, donc visible si les animations ne tournent pas */
.in{animation:rise .55s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.16s}.d3{animation-delay:.3s}
.d4{animation-delay:.44s}.d5{animation-delay:.54s}

h1{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.025em}
.tag{margin-top:9px;font-size:11.5px;font-weight:600;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ac2);line-height:1.75}
.rule{height:3px;width:46px;background:var(--ac);border-radius:2px;margin-top:14px;
  transform-origin:left;animation:grow .7s .35s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes grow{from{transform:scaleX(0)}}

/* ---------- le disque ---------- */
.orb{
  position:relative;display:block;width:min(300px,82vw);aspect-ratio:1;
  margin:4px auto 18px;text-decoration:none;color:var(--tx);
  transition:transform .14s
}
.orb:active{transform:scale(.965)}
.halo{
  position:absolute;inset:11%;border-radius:50%;
  background:radial-gradient(circle,rgba(70,87,241,.34) 0%,rgba(70,87,241,0) 68%);
  animation:breathe 3.6s ease-in-out infinite
}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.04)}}
.rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rings circle{fill:none;transform-origin:100px 100px}
.r1{stroke:var(--ac2);stroke-width:1.6;stroke-dasharray:2 11;opacity:.85;
  animation:spin 22s linear infinite}
.r2{stroke:var(--ac);stroke-width:2.6;stroke-dasharray:54 26;stroke-linecap:round;
  animation:spin 11s linear infinite reverse}
.r3{stroke:#39415c;stroke-width:5;stroke-dasharray:1.5 7;opacity:.75;
  animation:spin 34s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.core{
  position:absolute;inset:23%;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#222838 0%,#13161f 72%);
  border:1.5px solid #3a4466;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 0 0 1px rgba(133,145,255,.18), inset 0 0 26px rgba(70,87,241,.22);
}
.k3{font-size:clamp(38px,13vw,52px);font-weight:800;line-height:.92;letter-spacing:-.04em}
.kp{font-size:clamp(10px,3.3vw,12.5px);font-weight:700;letter-spacing:.24em;
  text-transform:uppercase;color:var(--ac2);margin-top:5px}
.hint{
  position:absolute;left:0;right:0;bottom:-21px;text-align:center;
  font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:#5e6680;animation:blink 2s ease-in-out infinite
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- rangée secondaire ---------- */
.sec{display:flex;gap:11px}
.sec a{
  flex:1;min-width:0;border:1px solid var(--line);padding:13px 10px;
  text-decoration:none;color:var(--tx);display:flex;flex-direction:column;
  align-items:center;gap:6px;
  clip-path:polygon(0 0, calc(100% - 11px) 0, 100% 11px, 100% 100%, 11px 100%, 0 calc(100% - 11px));
  transition:background .18s,border-color .18s,transform .12s
}
.sec a:hover{background:var(--panel);border-color:#394054}
.sec a:active{transform:scale(.97);background:var(--panel)}
.big{font-size:15px;line-height:1}
.stars{color:var(--gold);letter-spacing:1.6px;font-size:12.5px}
.lab{font-size:12px;font-weight:600;text-align:center;line-height:1.25;color:var(--mu)}

/* ---------- contact ---------- */
.ct{border:1px solid var(--line);background:var(--panel);
  clip-path:polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px))}
.ct a{display:flex;align-items:center;gap:13px;padding:14px 17px;text-decoration:none;
  color:var(--tx);font-size:14.5px;font-weight:500;border-bottom:1px solid var(--line);
  transition:background .16s}
.ct a:last-child{border-bottom:none}
.ct a:hover,.ct a:active{background:var(--panel2)}
.ct .k{flex:0 0 20px;text-align:center;font-size:15px;color:var(--ac2)}
.ct .v{display:block;color:var(--mu);font-size:13px;font-weight:400;margin-top:1px}

.save{display:block;text-align:center;text-decoration:none;background:var(--ac);
  color:#fff;font-weight:700;font-size:15px;padding:16px;
  clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  transition:filter .16s,transform .12s}
.save:hover{filter:brightness(1.1)}
.save:active{transform:scale(.98);filter:brightness(.92)}

footer{text-align:center;color:#5e6680;font-size:11.5px;line-height:1.6;font-weight:500}
footer b{color:var(--mu);font-weight:600}

@media(prefers-reduced-motion:reduce){
  .in,.rule,.halo,.r1,.r2,.r3,.hint{animation:none}
  *{transition:none!important}
}
</style>
</head>

<script>
(function(){
  // Discord n'expose pas d'URL publique par pseudo : un clic copie le pseudo.
  var r=document.getElementById('dcRow'), v=document.getElementById('dcVal');
  if(!r) return;
  r.addEventListener('click',function(e){
    e.preventDefault();
    var t=r.dataset.tag;
    var fini=function(){ v.textContent='copié !';
      setTimeout(function(){ v.textContent=t; },1500); };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(fini,fini);
    } else {
      var i=document.createElement('input'); i.value=t; document.body.appendChild(i);
      i.select(); try{ document.execCommand('copy'); }catch(_){}
      document.body.removeChild(i); fini();
    }
  });
})();
</script>
